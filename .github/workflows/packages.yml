name: Build preview distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python tools/generate.py --check
      - run: python tools/check_packages.py
      - run: python -m pip install build
      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d /var/tmp/peru-sdk-distributions.XXXXXXXX)
          echo "PERU_SDK_DIST=$stage" >> "$GITHUB_ENV"
          python -m build sdk-python --outdir "$stage"
          git archive --format=tar.gz --output="$stage/peru-sdk-source.tar.gz" HEAD
          cd "$stage"
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peru-sdk-preview-${{ github.sha }}
          path: ${{ env.PERU_SDK_DIST }}
          retention-days: 14
