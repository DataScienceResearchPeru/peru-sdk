name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: Independent SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install -r tools/requirements.txt
      - name: Verify independent repositories and packages
        run: |
          stage=$(mktemp -d /var/tmp/peru-ecosystem.XXXXXXXX)
          echo "ECOSYSTEM_REPORT=$stage" >> "$GITHUB_ENV"
          python tools/check_ecosystem.py --output "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ecosystem-${{ github.sha }}
          path: ${{ env.ECOSYSTEM_REPORT }}
